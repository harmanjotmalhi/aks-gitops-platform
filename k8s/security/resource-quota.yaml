# Resource governance for the sample-app namespace: caps total consumption and
# enforces default requests/limits so a single workload cannot starve the node pool.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sample-app-quota
  namespace: sample-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "25"
    services: "10"
    secrets: "25"
    configmaps: "25"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sample-app-limits
  namespace: sample-app
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi
