name: terraform-ci

# Validate and plan Terraform on every PR that touches infrastructure code.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write   # for OIDC auth to Azure (azure/login)

env:
  TF_VERSION: "1.7.5"

jobs:
  fmt-validate:
    name: fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/modules/networking
          - terraform/modules/aks
          - terraform/bootstrap
          - terraform/environments/dev
          - terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt (check)
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}

      # init without backend so validate works without cloud credentials.
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: terraform validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: fmt-validate
    # Plan only runs when Azure OIDC secrets are configured.
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        run: terraform init -input=false
        working-directory: terraform/environments/${{ matrix.env }}
        env:
          ARM_USE_OIDC: "true"

      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: terraform/environments/${{ matrix.env }}
        env:
          ARM_USE_OIDC: "true"

      - name: Save plan output
        if: always()
        run: terraform show -no-color tfplan > plan.txt
        working-directory: terraform/environments/${{ matrix.env }}

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `terraform/environments/${{ matrix.env }}/plan.txt`;
            let plan = 'No plan output produced.';
            try { plan = fs.readFileSync(path, 'utf8'); } catch (e) {}
            const body = `#### Terraform Plan (\`${{ matrix.env }}\`)\n\`\`\`\n${plan.substring(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
