# Default values for sample-web-app.
# Environment-specific overrides live in values-dev.yaml / values-prod.yaml.

replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Namespace the app runs in. Created/managed by k8s/security manifests.
namespace: sample-app

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod-level security context (runs as non-root, read-only root fs friendly image).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Container-level security context — least privilege.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

# Resource requests/limits — required for HPA and fair scheduling.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Liveness/readiness/startup probes.
probes:
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

# Horizontal Pod Autoscaler.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Environment variables injected into the container.
env:
  APP_ENV: default
  LOG_LEVEL: info

# Non-secret configuration rendered into a ConfigMap and mounted/exposed.
config:
  WELCOME_MESSAGE: "Hello from the AKS GitOps platform"

# Reference to secrets (names only — never actual secret values in Git).
# Secret objects are provisioned via the Key Vault CSI driver (see k8s/security).
secretRefs: []
  # - name: sample-app-secrets
  #   keys: [DB_PASSWORD]

# Pod scheduling — target the application node pool.
nodeSelector:
  workload-type: application

tolerations: []

affinity: {}

# Spread replicas across nodes for availability.
topologySpreadConstraints:
  enabled: true
  maxSkew: 1

podAnnotations: {}
