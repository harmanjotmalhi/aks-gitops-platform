# Secrets management WITHOUT storing secret values in Git.
#
# The Azure Key Vault Provider for Secrets Store CSI Driver (enabled on the AKS
# cluster via the Terraform `key_vault_secrets_provider` block) mounts secrets
# from Azure Key Vault into pods at runtime and optionally syncs them to native
# Kubernetes Secret objects.
#
# Only references (Key Vault name + object names) live in Git — never values.
#
# Prerequisites:
#   * A Key Vault exists and contains the referenced secrets.
#   * A user-assigned managed identity / workload identity has
#     "Key Vault Secrets User" role on the vault, federated to the app's
#     ServiceAccount via OIDC (see docs/SECURITY.md).
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sample-app-kv
  namespace: sample-app
spec:
  provider: azure
  # Sync selected Key Vault secrets into a Kubernetes Secret object so they can
  # be consumed via envFrom/secretRef (see Helm values .secretRefs).
  secretObjects:
    - secretName: sample-app-secrets
      type: Opaque
      data:
        - objectName: db-password
          key: DB_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Workload identity: client ID of the federated user-assigned identity.
    clientID: "REPLACE_WITH_WORKLOAD_IDENTITY_CLIENT_ID"
    keyvaultName: "REPLACE_WITH_KEYVAULT_NAME"
    tenantId: "REPLACE_WITH_AZURE_TENANT_ID"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""
